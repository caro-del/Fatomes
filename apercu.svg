<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f6f1e7"/>
<rect x="0" y="0" width="24" height="630" fill="#d9381e"/>
<text x="90" y="130" font-family="Georgia,serif" font-size="44" font-weight="700" fill="#1b1a17">Fantômes</text>
<text x="90" y="290" font-family="Georgia,serif" font-size="88" font-weight="700" fill="#1b1a17">Débusque les</text>
<text x="90" y="390" font-family="Georgia,serif" font-size="88" font-weight="700" fill="#1b1a17">abonnements que tu</text>
<text x="90" y="490" font-family="Georgia,serif" font-size="88" font-weight="700" fill="#d9381e">paies sans t'en servir.</text>
</svg>
